# CI: lint, test and build the code. It runs on every pull request, and as
# the first stage of the Release pipeline on main.
name: CI

on:
  pull_request:
  workflow_call:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Test code, data and model
        run: uv run pytest -v
      - name: Build
        run: uv build --wheel
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
