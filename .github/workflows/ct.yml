# CT: retrain when new data lands, on a schedule, or on demand; run the gate;
# and roll a new champion out with the build already running.
name: CT

on:
  push:
    branches: [main]
    paths: ["datasets/**"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Two CT runs at once would both edit registry.json.
concurrency: ct

jobs:
  train-and-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      promoted: ${{ steps.gate.outputs.promoted }}
      registry-commit: ${{ steps.save.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Train a challenger
        run: uv run scripts/train.py
      - name: Promotion gate
        id: gate
        run: |
          before=$(jq -r .aliases.champion registry.json)
          uv run scripts/promote.py
          after=$(jq -r .aliases.champion registry.json)
          if [ "$before" != "$after" ]; then promoted=true; else promoted=false; fi
          echo "promoted=$promoted" >> "$GITHUB_OUTPUT"
      - name: Save the registry
        id: save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry.json
          git commit -m "ct: train a challenger and run the gate"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  staging:
    needs: train-and-gate
    if: needs.train-and-gate.outputs.promoted == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      ref: ${{ needs.train-and-gate.outputs.registry-commit }}
      new-build: false
  production:
    needs: [train-and-gate, staging]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      ref: ${{ needs.train-and-gate.outputs.registry-commit }}
      new-build: false
