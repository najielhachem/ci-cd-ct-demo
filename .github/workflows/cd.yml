# CD: deploy what CI built, once CI passes on main.
name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    # Add a required reviewer to this environment to show a manual approval.
    environment: production
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Download the wheel CI built
        uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: astral-sh/setup-uv@v6
      - name: Deploy
        run: uv run scripts/deploy.py --wheel dist/*.whl
